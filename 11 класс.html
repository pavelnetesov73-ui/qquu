<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Девятый класс</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            text-align: center;
            color: #ff6b88;
            text-shadow: 2px 2px 0px #ffdae0;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        .list-container {
            background-color: #fff9e6;
            padding: 25px;
            border-radius: 10px;
            border: 2px dashed #ffcc00;
            text-align: left;
        }
        ul {
            font-size: 1.2em;
            line-height: 1.6;
        }
        li {
            margin-bottom: 15px;
            padding-left: 10px;
            transition: transform 0.2s;
        }
        li:hover {
            transform: translateX(10px);
            color: #ff6b88;
        }
        .decoration {
            text-align: center;
            margin: 30px 0;
        }
        .decoration span {
            display: inline-block;
            font-size: 2em;
            margin: 0 5px;
            color: #ffcc00;
        }
        /* Кнопка домой */
        .home-button {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .home-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Одинадцатый класс</h1>
        
        <div class="decoration">
            <span>✏️</span>
            <span>📚</span>
            <span>🎒</span>
            <span>🍎</span>
        </div>
        
        <div class="list-container">
            <h2>Практикумы</h2>
            <ul>
                <li class="topic-item"><a href="https://www.youtube.com/watch?v=S1HalUuPB7Q" class="topic-link">Видео/практика: Создание приложения в MIT App Inventor</a></li>
				<li class="topic-item"><a href="https://youtu.be/nTeRKvg4b5k" class="topic-link">Видео/практика: Приложение для рисования</a></li>
	            <li><a href="" target="_blank"></li>
                <li>Линейка</li>
                <li>Акварельные краски и кисточки</li>
                <li>Папка для труда и цветная бумага</li>
            </ul>
        </div>
        
        <div class="decoration">
            <span>🔢</span>
            <span>🔠</span>
            <span>🎨</span>
            <span>🧮</span>
        </div>

        <!-- Кнопка домой -->
        <a href="Квизы.html" class="home-button">🏠 На главную</a>
    </div>
</body>
</html>
